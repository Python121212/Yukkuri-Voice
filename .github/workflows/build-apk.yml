name: build-apk

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dict tooling
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Build reading dictionary
        run: npm run dict && ls -la app/src/main/assets/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install \
            "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Native engine sanity test (host gcc)
        run: |
          gcc -std=c99 -O2 -Wall -Wextra -Icore/include core/src/*.c tools/cli.c -lm -o /tmp/ykcli
          /tmp/ykcli "ゆっくりしていってね" /tmp/test.wav yukkuri --dump | head -5
          ls -la /tmp/test.wav

      # 失敗の原因をログ API なしでも読めるよう annotation で出す
      - name: Kotlin unit tests
        run: |
          set +e
          gradle --no-daemon -p . :app:testDebugUnitTest > /tmp/test.log 2>&1
          rc=$?
          tail -30 /tmp/test.log
          if [ $rc -ne 0 ]; then
            grep -E "^e: |FAILED|expected:|What went wrong|Execution failed" /tmp/test.log \
              | head -30 | while IFS= read -r line; do echo "::error title=test::$(echo "$line" | sed 's|.*/app/src/|app/src/|')"; done
          else
            echo "::notice title=tests::OK"
          fi
          exit $rc

      - name: Build debug APK
        run: |
          set +e
          gradle --no-daemon -p . :app:assembleDebug --stacktrace > /tmp/build.log 2>&1
          rc=$?
          tail -40 /tmp/build.log
          if [ $rc -ne 0 ]; then
            grep -E "^e: |CMake Error|FAILURE:|error:|error when building|What went wrong|Execution failed|Caused by:" /tmp/build.log \
              | head -30 | while IFS= read -r line; do echo "::error title=gradle::$(echo "$line" | sed 's|.*/app/src/|app/src/|')"; done
          fi
          exit $rc

      - name: Collect outputs
        run: |
          mkdir -p ci-out
          cp app/build/outputs/apk/debug/*.apk ci-out/ 2>/dev/null || true
          cp /tmp/test.wav ci-out/ 2>/dev/null || true
          ls -la ci-out
          echo "APK_SIZE=$(stat -c%s ci-out/app-debug.apk 2>/dev/null || echo 0)" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yukkuri-debug
          path: ci-out/*
          if-no-files-found: warn

      # Releases に APK を添付すると、API 経由で取得できる (sandbox からでも取り出せる)
      - name: Publish to release
        if: github.ref_type == 'tag' || github.ref == 'refs/heads/arena/db7172c6-yukkuri-voice'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="apk-latest"
          TITLE="Yukkuri Voice (debug APK)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ci-out/app-debug.apk --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "commit ${GITHUB_SHA} / 自動ビルド ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          else
            gh release create "$TAG" ci-out/app-debug.apk \
              --title "$TITLE" \
              --notes "commit ${GITHUB_SHA} / 自動ビルド" \
              --prerelease
          fi
          gh release view "$TAG" --json assets -q '.assets[] | "asset: \(.name) \(.size)"'
