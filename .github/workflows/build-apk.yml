name: build-apk

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dict tooling
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Build reading dictionary
        run: npm run dict && ls -la app/src/main/assets/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install \
            "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Native engine sanity test (host gcc)
        run: |
          gcc -std=c99 -O2 -Wall -Wextra -Icore/include core/src/*.c tools/cli.c -lm -o /tmp/ykcli
          /tmp/ykcli "ゆっくりしていってね" /tmp/test.wav yukkuri --dump | head -5
          ls -la /tmp/test.wav

      - name: Build debug APK
        run: |
          set +e
          gradle --no-daemon -p . :app:assembleDebug --stacktrace > /tmp/build.log 2>&1
          rc=$?
          tail -60 /tmp/build.log
          if [ $rc -ne 0 ]; then
            # ログ API が使えない環境でも原因が分かるように、要点を annotation で出す
            grep -E "e: file|e: |error:|Unresolved reference|What went wrong|Execution failed" /tmp/build.log \
              | grep -v "deprecated" | head -30 | while IFS= read -r line; do echo "::error title=gradle::$line"; done
          fi
          exit $rc

      - name: Collect outputs
        run: |
          echo "::notice title=APK::$(ls -la app/build/outputs/apk/debug/ 2>/dev/null | tr '\n' ' ')"
          mkdir -p ci-out
          cp app/build/outputs/apk/debug/*.apk ci-out/ 2>/dev/null || true
          cp /tmp/test.wav ci-out/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yukkuri-debug
          path: ci-out/*
          if-no-files-found: warn
