name: probe
on: [push, workflow_dispatch]
jobs:
  env:
    runs-on: ubuntu-latest
    steps:
      - name: Info
        run: |
          echo "::notice title=JAVA::$(java -version 2>&1 | head -1)"
          echo "::notice title=SDK::$(ls $ANDROID_HOME/platforms 2>/dev/null | tr '\n' ' ')"
          echo "::notice title=BUILDTOOLS::$(ls $ANDROID_HOME/build-tools 2>/dev/null | tr '\n' ' ')"
          echo "::notice title=KOTLINC::$(which kotlinc || echo none)"
          echo "::notice title=GRADLE::$(which gradle || echo none)"
      - name: Make wav artifact
        run: |
          python3 -c "
          import wave, math, struct
          w=wave.open('test.wav','w'); w.setnchannels(1); w.setsampwidth(2); w.setframerate(16000)
          w.writeframes(b''.join(struct.pack('<h', int(8000*math.sin(2*math.pi*440*i/16000))) for i in range(16000)))
          w.close()"
      - uses: actions/upload-artifact@v4
        with:
          name: test-audio
          path: test.wav
